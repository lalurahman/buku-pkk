services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: buku-pkk-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-buku_pkk}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-root}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - buku-pkk

  webserver:
    image: nginx:alpine
    container_name: buku-pkk-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8010}:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - buku-pkk

  mysql:
    image: mysql:8.0
    container_name: buku-pkk-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-buku_pkk}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
    ports:
      - "${FORWARD_DB_PORT:-3316}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - buku-pkk

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: buku-pkk-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: ${DB_PASSWORD:-root}
    ports:
      - "${FORWARD_PHPMYADMIN_PORT:-8081}:80"
    depends_on:
      - mysql
    networks:
      - buku-pkk

  node:
    image: node:20-alpine
    container_name: buku-pkk-node
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    ports:
      - "${VITE_PORT:-5173}:5173"
    command: sh -c "npm install && npm run dev -- --host"
    networks:
      - buku-pkk

networks:
  buku-pkk:
    driver: bridge

volumes:
  mysql-data:
  vendor:
